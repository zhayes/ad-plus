<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>Ad+</title>
<style>
:root{--bg:#0b0c10;--text:#e8eaf0;--dim:#6c7484;--accent:#b833af;
--font:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif}
*{box-sizing:border-box;margin:0}
body{height:100vh;background:radial-gradient(620px 320px at 50% 38%,rgba(200,47,160,.16),transparent 70%),var(--bg);
color:var(--text);font:13px/1.5 var(--font);display:grid;place-items:center;overflow:hidden}
.wrap{display:flex;flex-direction:column;align-items:center;gap:18px;margin-top:-24px}
.glyph{width:54px;height:54px;display:block;
filter:drop-shadow(0 14px 34px rgba(224,51,138,.38));animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:translateY(0) scale(1);opacity:1}50%{transform:translateY(-3px) scale(1.03);opacity:.9}}
h1{font-size:15px;font-weight:560;letter-spacing:.3px}
.sub{color:var(--dim);font-size:12px;display:flex;align-items:center;gap:8px;min-height:18px}
.dots{display:flex;gap:4px}
.dots i{width:4px;height:4px;border-radius:50%;background:#3a3f52;animation:pulse 1.4s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.18s}.dots i:nth-child(3){animation-delay:.36s}
@keyframes pulse{0%,100%{background:#3a3f52}50%{background:var(--accent)}}
</style></head><body>
<div class="wrap">
  <img class="glyph" src="/icon.svg" alt="">
  <div class="sub"><span id="msg">正在启动制作引擎</span><span class="dots" id="dots"><i></i><i></i><i></i></span></div>
</div>
<script>
const msg = document.getElementById('msg');
let tries = 0;
async function waitForBackend() {
  tries++;
  try {
    const r = await fetch('/api/bootstrap', { cache: 'no-store' });
    if (r.ok) {
      const b = await r.json();
      msg.textContent = b.has_model ? '准备就绪' : '需要先接入一个模型';
      if (!location.search.includes('stay')) setTimeout(() => location.replace(b.has_model ? '/' : '/onboarding'), 240);
      return;
    }
  } catch (e) { /* backend not up yet */ }
  if (tries > 90) { msg.textContent = '后端没有响应，请查看应用日志'; document.getElementById('dots').style.display = 'none'; return; }
  setTimeout(waitForBackend, 400);
}
fetch('/api/health', { cache: 'no-store' }).catch(() => {}).finally(waitForBackend);
</script>
</body></html>
